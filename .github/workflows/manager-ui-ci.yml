name: manager-ui-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'maneger-web/**'
      - 'deploy/nginx.conf'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像命名空间全小写
  IMAGE: jerry-guo1020/healthyapp/web

# 部署说明：GitHub 海外 runner 无法直连国内服务器 22 端口(SSH 握手被重置)，
# 故采用「服务器主动拉取」模型：服务器 cron 定时 docker compose pull && up。
# CI 只负责构建并推送镜像到 GHCR（镜像为 public，服务器可匿名拉取）。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: maneger-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}