name: manager-ui-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'maneger-web/**'
      - 'deploy/nginx.conf'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建管理端前端镜像（多阶段构建）
        run: docker build -f maneger-web/Dockerfile -t shanheng-web:latest .

      - name: 登录 GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 推送镜像
        run: |
          docker tag shanheng-web:latest ghcr.io/${{ github.repository }}/web:latest
          docker push ghcr.io/${{ github.repository }}/web:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/shanheng
            export IMAGE_PREFIX=ghcr.io/${{ github.repository }}
            docker compose pull web
            docker compose up -d web