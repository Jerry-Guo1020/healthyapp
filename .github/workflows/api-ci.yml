name: api-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'deploy/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 打包（使用项目自带 mvnw）
        working-directory: api
        run: ./mvnw -B clean package -DskipTests

      - name: 构建 Docker 镜像
        working-directory: api/ruoyi-admin
        run: docker build -t shanheng-api:latest .

      - name: 登录 GHCR
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 推送镜像
        run: |
          docker tag shanheng-api:latest ghcr.io/${{ github.repository }}/api:latest
          docker push ghcr.io/${{ github.repository }}/api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/shanheng
            export IMAGE_PREFIX=ghcr.io/${{ github.repository }}
            docker compose pull api
            docker compose up -d api