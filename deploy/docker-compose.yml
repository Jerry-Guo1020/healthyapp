version: "3.8"

# 膳衡 App 生产部署编排
# 镜像由 GitHub Actions 构建推送到 GHCR，服务器执行：docker compose pull && docker compose up -d
# 端口说明：宿主机 80/3306/8080 已被其他服务占用，故映射 18080(api)/18081(web)/13306(mysql)/16379(redis)

services:
  mysql:
    image: mysql:8.0
    container_name: shanheng-mysql
    restart: always
    mem_limit: 500m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+8:00
      - --innodb-buffer-pool-size=48M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306"

  redis:
    image: redis:7-alpine
    container_name: shanheng-redis
    restart: always
    mem_limit: 80m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:16379:6379"

  api:
    image: ghcr.io/jerry-guo1020/healthyapp/api:latest
    container_name: shanheng-api
    restart: always
    mem_limit: 900m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:-UseZGC -XX:+UseG1GC -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    ports:
      - "18080:8080"

  web:
    image: ghcr.io/jerry-guo1020/healthyapp/web:latest
    container_name: shanheng-web
    restart: always
    depends_on:
      - api
    ports:
      - "18081:80"

volumes:
  mysql-data:
  redis-data: