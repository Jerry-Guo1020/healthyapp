version: "3.8"

# 膳衡 App 部署编排
# 本地：直接在 deploy/ 目录执行 docker compose up -d --build
# 生产：CI 推送镜像后，设置 IMAGE_PREFIX=ghcr.io/<owner>/<repo>，执行 docker compose pull && docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: shanheng-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shanheng123}
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+8:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  redis:
    image: redis:7-alpine
    container_name: shanheng-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ruoyi123}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    image: ${IMAGE_PREFIX:-shanheng}/api:latest
    container_name: shanheng-api
    restart: always
    build:
      context: ../api/ruoyi-admin
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shanheng123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"

  web:
    image: ${IMAGE_PREFIX:-shanheng}/web:latest
    container_name: shanheng-web
    restart: always
    build:
      context: ..
      dockerfile: maneger-web/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data: